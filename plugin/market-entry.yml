url: https://github.com/jqlong17/dsh-pocket-ios/tree/main/plugin
name: jqlong17/dsh-pocket-ios#plugin
category: remote
description:
  en: 'Adds an iOS client download QR and setup guide above the LAN access section of DSH Pocket''s phone-access settings page, linking the DSH Pocket iOS app (self-signed install) to this machine.'
  zh: '在 DSH「手机访问」设置页的局域网访问上方加入 iOS 客户端下载二维码与安装引导，把自签安装的 DSH Pocket iOS 连接到本机 DSH。'
