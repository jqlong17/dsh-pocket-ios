description:
  en: 'Adds a native "Phone access (iOS)" settings page: App Store QR, fixed Tailscale address/QR, and local access-password management. Ships its own stable local proxy and login endpoint, so it does not depend on dsh-pocket.'
  zh: '在 DSH 设置中新增原生「手机访问（iOS）」：App Store 下载二维码、Tailscale 固定地址/二维码、本机访问密码管理；自带稳定入口代理与登录端点，不依赖 dsh-pocket。'
